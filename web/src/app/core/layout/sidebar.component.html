<aside class="hidden h-full w-[260px] shrink-0 border-r border-[#dfe7ef] bg-[#f9fafb] md:block">
	<nav class="flex flex-col gap-2 p-4 pt-5" aria-label="Navegação principal">
		<a
			routerLink="/"
			routerLinkActive="bg-[#1b3d5b] text-white shadow-sm"
			[routerLinkActiveOptions]="{ exact: true }"
			class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.02rem] font-semibold text-[#1b3d5b] transition-colors hover:bg-[#edf1f5]"
		>
			<span class="material-icons text-xl" aria-hidden="true">home</span>
			Início
		</a>

		<a
			routerLink="/pessoas"
			routerLinkActive="bg-[#1b3d5b] text-white shadow-sm"
			class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.02rem] font-semibold text-[#1b3d5b] transition-colors hover:bg-[#edf1f5]"
		>
			<span class="material-icons text-xl" aria-hidden="true">groups</span>
			Pessoas
		</a>

		<!-- Sub-recursos de Pessoas -->
		<a
			routerLink="/pessoas/comorbidades"
			routerLinkActive="bg-[#e9eef4] text-[#1b3d5b]"

		>
			<span class="material-icons text-lg" aria-hidden="true">medical_information</span>
			Comorbidades
		</a>

		<a
			routerLink="/pessoas/categorias"
			routerLinkActive="bg-[#e9eef4] text-[#1b3d5b]"
			class="ml-6 flex items-center gap-3 rounded-xl px-4 py-2 text-[0.98rem] font-medium text-[#4c6075] transition-colors hover:bg-[#edf1f5]"
		>
			<span class="material-icons text-xl" aria-hidden="true">category</span>
			Categorias
		</a>
	</nav>
