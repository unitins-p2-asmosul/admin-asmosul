
<div class="flex min-h-screen flex-col bg-[#edf1f5] text-gray-900">
  <app-header
    (aoAlternarMenu)="alternarMenuMobile()"
  />

  <div class="relative flex flex-1 items-stretch">

    @if (menuMobileAberto()) {
      <button
        type="button"
        class="fixed inset-0 z-40 cursor-default bg-black/40 md:hidden"
        aria-label="Fechar menu lateral"
        (click)="fecharMenuMobile()"
      ></button>
    }

    <app-sidebar
      [menuAberto]="menuMobileAberto()"
      (aoFechar)="fecharMenuMobile()"
    />

    <main class="min-w-0 flex-1 bg-[#edf1f5] p-0">
      <router-outlet />
    </main>

  </div>

  <app-footer />
</div>
