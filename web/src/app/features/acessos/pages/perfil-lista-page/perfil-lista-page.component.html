<section class="pagina-pessoas mx-auto max-w-[1100px]">
  <header class="pagina-pessoas__header !justify-start">
    <h1>Gerenciamento de Perfis</h1>
  </header>

  <div class="pessoa-tabela-scroll">
    <table mat-table [dataSource]="perfis()" class="pessoa-table pessoa-table--apoio">
      <ng-container matColumnDef="indice">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let perfil; let i = index" class="pessoa-table__numero">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let perfil" class="!min-w-[260px]">{{ perfil.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let perfil" class="!min-w-[360px]">{{ perfil.descricao }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell p-6 text-center text-slate-500" [attr.colspan]="colunas.length">
          Nenhum perfil disponível.
        </td>
      </tr>
    </table>
  </div>
</section>
