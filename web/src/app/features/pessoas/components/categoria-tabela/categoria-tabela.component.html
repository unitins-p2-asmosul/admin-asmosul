<div class="pessoa-tabela-shell">
<div class="pessoa-tabela-scroll">
  <table
    mat-table
    [dataSource]="dados()"
    matSort
    [matSortActive]="campoOrdenado"
    [matSortDirection]="direcaoOrdenada"
    matSortDisableClear
    (matSortChange)="aoMudarOrdem.emit($event)"
    class="pessoa-table pessoa-table--apoio"
  >
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="id" class="w-20">#</th>
      <td mat-cell *matCellDef="let item" class="pessoa-table__numero">{{ item.id }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="w-40">Ações</th>
      <td mat-cell *matCellDef="let item" class="pessoa-table__acoes">
        <div class="pessoa-table__acoes-inner">
          <button mat-icon-button type="button" matTooltip="Visualizar" aria-label="Visualizar categoria" (click)="aoVisualizar.emit(item.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button type="button" matTooltip="Editar" aria-label="Editar categoria" (click)="aoEditar.emit(item.id)">
            <mat-icon>edit</mat-icon>
          </button>
          @if (item.ativo) {
            <button mat-icon-button type="button" matTooltip="Desativar" aria-label="Desativar categoria" (click)="aoAlternarEstado.emit({ id: item.id, ativo: false })">
              <mat-icon>delete</mat-icon>
            </button>
          } @else {
            <button mat-icon-button type="button" matTooltip="Reativar" aria-label="Reativar categoria" (click)="aoAlternarEstado.emit({ id: item.id, ativo: true })">
              <mat-icon>restore</mat-icon>
            </button>
          }
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="nome">Nome</th>
      <td mat-cell *matCellDef="let item" class="pessoa-table__texto">{{ item.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let item" class="pessoa-table__texto">{{ item.descricao || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="w-44">Status</th>
      <td
        mat-cell
        *matCellDef="let item"
        class="pessoa-table__status-cell pessoa-table__status-button"
        [class.pessoa-table__status-button--ativo]="item.ativo"
        [class.pessoa-table__status-button--inativo]="!item.ativo"
        role="button"
        tabindex="0"
        [attr.aria-label]="item.ativo ? 'Desativar categoria' : 'Reativar categoria'"
        (click)="aoAlternarEstado.emit({ id: item.id, ativo: !item.ativo })"
        (keydown.enter)="aoAlternarEstado.emit({ id: item.id, ativo: !item.ativo })"
        (keydown.space)="$event.preventDefault(); aoAlternarEstado.emit({ id: item.id, ativo: !item.ativo })"
      >
        {{ item.ativo ? 'Ativo' : 'Desativado' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell p-6 text-center text-gray-500" [attr.colspan]="colunasExibidas.length">
        @if (carregando()) { Carregando categorias... } @else { Nenhuma categoria encontrada. }
      </td>
    </tr>
  </table>
</div>
</div>

<nav class="pessoa-tabela__paginacao" aria-label="Paginação de categorias">
  <button type="button" class="pessoa-tabela__pagina-seta" [disabled]="paginaAtual() === 0" aria-label="Página anterior" (click)="mudarPagina(paginaAtual() - 1)">
    &lt;
  </button>
  @for (pagina of paginas; track pagina) {
    <button type="button" class="pessoa-tabela__pagina" [class.pessoa-tabela__pagina--ativa]="pagina === paginaAtual()" [attr.aria-current]="pagina === paginaAtual() ? 'page' : null" (click)="mudarPagina(pagina)">
      {{ pagina + 1 }}
    </button>
  }
  <button type="button" class="pessoa-tabela__pagina-seta" [disabled]="paginaAtual() >= totalPaginas - 1" aria-label="Próxima página" (click)="mudarPagina(paginaAtual() + 1)">
    &gt;
  </button>
</nav>
