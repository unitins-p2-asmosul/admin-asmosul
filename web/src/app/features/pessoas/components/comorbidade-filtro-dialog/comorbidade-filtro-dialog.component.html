<div class="pagina-formulario">
  <h2 mat-dialog-title class="flex items-center gap-3 !text-2xl !font-bold">
    <mat-icon class="!h-8 !w-8 !text-3xl">tune</mat-icon>
    Filtrar Comorbidades
  </h2>

  <mat-dialog-content [formGroup]="form" class="flex flex-col gap-5 !pt-2">
    <div>
      <h3 class="mb-3 text-base font-semibold text-gray-800">Identificação</h3>
      <mat-form-field appearance="outline" class="w-full">
        <input
          matInput
          formControlName="nome"
          placeholder="Nome"
          aria-label="Filtrar por nome"
          (keydown.enter)="aplicar()"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div>
      <h3 class="mb-2 text-base font-semibold text-gray-800">Status</h3>
      <mat-checkbox formControlName="apenasInativos" color="primary">
        Mostrar apenas desativados
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center" class="!gap-4 !pb-5">
    <button mat-flat-button type="button" (click)="limpar()">Limpar</button>
    <button mat-flat-button type="submit" (click)="aplicar()">Aplicar Filtros</button>
  </mat-dialog-actions>
</div>
