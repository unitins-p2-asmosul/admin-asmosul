<h2 mat-dialog-title class="flex items-center gap-5 !px-12 !pt-9 text-4xl font-bold text-asmosul-navy">
  <span class="material-icons text-5xl font-normal" aria-hidden="true">tune</span>
  <span>Filtrar Categorias</span>
</h2>

<mat-dialog-content [formGroup]="form" class="!min-w-0 !px-12 !pt-2 sm:min-w-[38rem]">
  <div>
    <h3 class="mb-2 text-lg font-bold text-slate-800">Identificação</h3>
    <div class="flex h-8 w-44 items-center rounded-lg bg-asmosul-navy px-3">
      <input
        matInput
        formControlName="nome"
        aria-label="Nome da categoria"
        placeholder="Nome"
        class="w-full border-0 bg-transparent text-xs font-bold text-white outline-none placeholder:text-white"
      />
      <span class="material-icons text-base text-white" aria-hidden="true">search</span>
    </div>
  </div>

  <div class="mt-5">
    <h3 class="mb-2 text-lg font-bold text-slate-800">Status</h3>
    <mat-checkbox formControlName="apenasDesativados" color="primary">
      Mostrar apenas desativados
    </mat-checkbox>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="center" class="gap-3 !px-12 !pb-12 !pt-8">
  <button mat-flat-button type="button" class="!h-7 !min-w-24 !rounded-sm !bg-asmosul-navy !px-3 !text-xs !text-white" (click)="limpar()">Limpar</button>
  <button mat-flat-button color="primary" type="button" class="!h-7 !min-w-24 !rounded-sm !px-3 !text-xs" (click)="aplicar()">Aplicar Filtros</button>
</mat-dialog-actions>
