<app-pagina-gerenciamento
  titulo="Gerenciamento de Categorias"
  icone="category"
  rotuloAdicionar="Adicionar Categoria"
  (aoAdicionar)="adicionar()"
  (aoFiltrar)="abrirFiltros()"
>
  <div toolbar-actions class="flex min-w-0 flex-1 items-center gap-2">
    <button
      mat-stroked-button
      type="button"
      class="pagina-pessoas__status-toggle"
      [class.pagina-pessoas__status-toggle--ativo]="parametrosAtuais().incluirInativos"
      [attr.aria-pressed]="parametrosAtuais().incluirInativos"
      [title]="
        parametrosAtuais().incluirInativos
          ? 'Ocultar categorias inativas'
          : 'Exibir categorias inativas'
      "
      (click)="alternarInativos()"
    >
      <mat-icon>visibility_off</mat-icon>
      Exibir inativas
    </button>
    <app-controles-exportacao
      class="min-w-0 flex-1"
      [colunas]="tabela.colunasExportaveis"
      chaveStorage="categorias-pessoas"
      (aoExportar)="tabela.exportar($event)"
      (aoMudarColunas)="idsColunasVisiveis.set($event)"
    />
  </div>
  <app-categoria-tabela
    #tabela
    [dados]="resposta().dados"
    [totalElementos]="resposta().totalElementos"
    [tamanhoPagina]="20"
    [paginaAtual]="resposta().paginaAtual"
    [carregando]="carregando()"
    [colunasVisiveis]="idsColunasVisiveis()"
    [ordenacao]="parametrosAtuais().sort ?? 'nome,asc'"
    (aoMudarPagina)="irParaPagina($event.pageIndex)"
    (aoMudarOrdem)="ordenar($event.active)"
    (aoVisualizar)="visualizar($event)"
    (aoEditar)="editar($event)"
    (aoAlternarEstado)="alternarEstado($event)"
    (aoExportar)="exportar($event)"
  />
</app-pagina-gerenciamento>
