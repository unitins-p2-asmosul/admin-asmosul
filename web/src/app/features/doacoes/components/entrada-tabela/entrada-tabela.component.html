<div class="pessoa-tabela-shell">
  <div class="pessoa-tabela-scroll">
    <table
      mat-table
      [dataSource]="dados()"
      matSort
      [matSortActive]="campoOrdenado"
      [matSortDirection]="direcaoOrdenada"
      matSortDisableClear
      (matSortChange)="aoMudarOrdem.emit($event)"
      class="pessoa-table pessoa-table--apoio tabela-asmosul"
    >
      <ng-container matColumnDef="indice">
        <th mat-header-cell *matHeaderCellDef>#</th>
        <td mat-cell *matCellDef="let entrada" class="pessoa-table__numero">
          {{ entrada.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let entrada">
          <div class="flex items-center">
            <button
              mat-icon-button
              type="button"
              matTooltip="Visualizar"
              aria-label="Visualizar entrada"
              (click)="aoVisualizar.emit(entrada.id)"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              matTooltip="Editar"
              aria-label="Editar entrada"
              (click)="aoEditar.emit(entrada.id)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              matTooltip="Excluir"
              aria-label="Excluir entrada"
              (click)="aoExcluir.emit({ id: entrada.id, descricaoItens: formatarItens(entrada) })"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef>Itens</th>
        <td
          mat-cell
          *matCellDef="let entrada"
          class="pessoa-table__texto max-w-[320px]"
          [matTooltip]="formatarItens(entrada)"
        >
          {{ formatarItens(entrada) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="doador">
        <th mat-header-cell *matHeaderCellDef>Doador</th>
        <td mat-cell *matCellDef="let entrada" class="pessoa-table__texto">
          {{ entrada.nomeDoador || 'Sem doador vinculado' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="dataHora">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="dataHora">Data hora</th>
        <td mat-cell *matCellDef="let entrada" class="pessoa-table__texto font-medium">
          {{ formatarDataHora(entrada) }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell p-6 text-center text-gray-500" [attr.colspan]="colunasExibidas.length">
          @if (carregando()) {
            Carregando entradas...
          } @else {
            Nenhuma entrada encontrada.
          }
        </td>
      </tr>
    </table>
  </div>
</div>

<nav class="pessoa-tabela__paginacao" aria-label="Paginação de entradas">
  <button
    type="button"
    class="pessoa-tabela__pagina-seta"
    [disabled]="paginaAtual() === 0"
    aria-label="Página anterior"
    (click)="mudarPagina(paginaAtual() - 1)"
  >
    &lt;
  </button>
  @for (pagina of paginas; track pagina) {
    <button
      type="button"
      class="pessoa-tabela__pagina"
      [class.pessoa-tabela__pagina--ativa]="pagina === paginaAtual()"
      [attr.aria-current]="pagina === paginaAtual() ? 'page' : null"
      (click)="mudarPagina(pagina)"
    >
      {{ pagina + 1 }}
    </button>
  }
  <button
    type="button"
    class="pessoa-tabela__pagina-seta"
    [disabled]="paginaAtual() >= totalPaginas - 1"
    aria-label="Próxima página"
    (click)="mudarPagina(paginaAtual() + 1)"
  >
    &gt;
  </button>
</nav>
