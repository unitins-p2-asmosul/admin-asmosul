<div class="pagina-formulario !my-0 !w-full !max-w-none">
  <h2 mat-dialog-title class="flex items-center gap-3 !text-2xl !font-bold !text-[#0b3c5d]">
    <mat-icon>tune</mat-icon>
    Filtrar itens
  </h2>

  <mat-dialog-content [formGroup]="form" class="grid gap-x-5 gap-y-2 sm:grid-cols-2">
    <div class="sm:col-span-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nome do item</mat-label>
        <input
          matInput
          formControlName="nome"
          (keydown.enter)="aplicar()"
          placeholder="Buscar por nome"
        />
      </mat-form-field>
    </div>

    <div class="sm:col-span-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Categorias</mat-label>
        <mat-select formControlName="categoriasIds" multiple placeholder="Selecione as categorias">
          @for (categoria of categorias(); track categoria.id) {
            <mat-option [value]="categoria.id">{{ categoria.nome }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Estoque</mat-label>
        <input
          matInput
          type="number"
          min="0"
          formControlName="estoque"
          (keydown.enter)="aplicar()"
          placeholder="Quantidade em estoque"
        />
      </mat-form-field>
    </div>

    <div class="grid grid-cols-2 gap-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Preço mín. (R$)</mat-label>
        <input
          matInput
          type="number"
          min="0"
          step="0.01"
          formControlName="precoUnitarioMinimo"
          (keydown.enter)="aplicar()"
          placeholder="0,00"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Preço máx. (R$)</mat-label>
        <input
          matInput
          type="number"
          min="0"
          step="0.01"
          formControlName="precoUnitarioMaximo"
          (keydown.enter)="aplicar()"
          placeholder="0,00"
        />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center" class="!gap-4 !pb-5">
    <button mat-flat-button type="button" (click)="limpar()">Limpar</button>
    <button mat-flat-button type="button" class="acao-primaria" (click)="aplicar()">
      Aplicar filtros
    </button>
  </mat-dialog-actions>
</div>
