<app-pagina-gerenciamento
  titulo="Categorias de Itens"
  icone=""
  iconeAdicionar="add"
  [adicionarNaToolbar]="true"
  rotuloAdicionar="Adicionar Categoria"
  [filtrosAtivos]="filtrosAtivos"
  (aoAdicionar)="irParaAdicionar()"
  (aoFiltrar)="abrirFiltros()"
>
  <div toolbar-actions class="flex items-center gap-1">
    <button
      mat-flat-button
      type="button"
      class="pagina-pessoas__filter"
      [matTooltip]="
        parametrosAtuais().apenasInativos
          ? 'Exibir categorias ativas'
          : 'Exibir categorias inativas'
      "
      [attr.aria-label]="
        parametrosAtuais().apenasInativos
          ? 'Exibir categorias ativas'
          : 'Exibir categorias inativas'
      "
      (click)="alternarInativos()"
    >
      <mat-icon>{{ parametrosAtuais().apenasInativos ? 'category' : 'visibility_off' }}</mat-icon>
      {{ parametrosAtuais().apenasInativos ? 'Exibir ativas' : 'Exibir inativas' }}
    </button>
    @if (filtrosAtivos > 0 || parametrosAtuais().apenasInativos) {
      <button
        mat-icon-button
        type="button"
        matTooltip="Limpar filtros"
        aria-label="Limpar filtros"
        (click)="limparFiltros()"
      >
        <mat-icon>filter_alt_off</mat-icon>
      </button>
    }
  </div>

  <app-categoria-item-tabela
    [dados]="resposta().dados"
    [totalElementos]="resposta().totalElementos"
    [tamanhoPagina]="resposta().tamanhoPagina"
    [paginaAtual]="resposta().paginaAtual"
    [carregando]="carregando()"
    [ordenacao]="parametrosAtuais().sort ?? 'nome,asc'"
    (aoMudarPagina)="mudarPagina($event)"
    (aoMudarOrdem)="mudarOrdem($event)"
    (aoVisualizar)="visualizar($event)"
    (aoEditar)="editar($event)"
    (aoAlternarEstado)="alternarEstado($event)"
  />
</app-pagina-gerenciamento>
