<section class="pagina-pessoas pb-12">
  <!-- Cabeçalho -->
  <header class="pagina-pessoas__header">
    <div class="pagina-pessoas__title-wrap">
      <div class="flex items-center gap-3">
        <span class="pagina-pessoas__title-icon flex h-12 w-12 items-center justify-center rounded-2xl bg-[#0b3c5d] text-white" aria-hidden="true">
          <mat-icon class="!h-6 !w-6 !text-2xl leading-none">category</mat-icon>
        </span>
        <h1 class="text-3xl font-extrabold tracking-tight text-[#0b3c5d]">
          Relatório de Categorias de Itens
        </h1>
      </div>
    </div>
  </header>

  <div class="mt-6 flex flex-col gap-6">
    <!-- Top 5 Categorias em Cards -->
    <app-ranking-cards
      titulo="Top 5 Categorias com Mais Variedade de Itens"
      [itens]="resumo().top5MaisVariedade"
      sufixo="itens"
    />

    <!-- Gráfico de Rosca: Participação no Catálogo com Exportação de Imagem -->
    @if (carregandoResumo()) {
      <div class="flex items-center justify-center py-16 text-[#8298a9]">
        <span class="text-base font-semibold">Carregando dados demográficos de categorias...</span>
      </div>
    } @else {
      <app-grafico-rosca
        titulo="Itens por Categoria (Top Participação)"
        [dados]="resumo().distribuicaoParticipacao"
      />
    }

    <!-- Card da Tabela de Categorias -->
    <article class="w-full rounded-2xl border border-[#dfe4ea] bg-white p-6 shadow-xs">
      <div class="mb-5 flex items-center gap-2">
        <h2 class="m-0 text-lg font-bold text-[#0b3c5d]">
          Categorias Cadastradas e Variedade de Itens
        </h2>
        <span class="inline-flex h-6 min-w-6 items-center justify-center rounded-full bg-[#f1f5f9] px-2 text-xs font-bold text-[#475569]">
          {{ respostaTabela().totalElementos }}
        </span>
      </div>

      <!-- Filtro Padronizado Inline -->
      <div class="mb-6 rounded-xl border border-slate-100 bg-slate-50/50 p-4">
        <form class="pagina-formulario !my-0 !w-full !max-w-none" (ngSubmit)="aplicarBusca()">
          <div class="grid grid-cols-1">
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Nome da categoria</mat-label>
              <input
                matInput
                [formControl]="controleBusca"
                (keydown.enter)="aplicarBusca()"
                placeholder="Buscar por nome da categoria"
              />
            </mat-form-field>
          </div>

          <!-- Ações Padronizadas Centralizadas -->
          <div class="flex items-center justify-center !gap-4 !pt-4 !pb-2">
            <button mat-flat-button type="button" (click)="limparBusca()">
              Limpar
            </button>
            <button mat-flat-button type="submit" class="acao-primaria">
              Aplicar filtros
            </button>
          </div>
        </form>
      </div>

      <!-- Barra de Exportação e Colunas -->
      <div class="mb-3">
        <app-controles-exportacao
          [colunas]="tabela.colunasExportaveis"
          chaveStorage="relatorio_categorias_colunas"
          (aoExportar)="tabela.exportar($event)"
          (aoMudarColunas)="idsColunasVisiveis.set($event)"
        />
      </div>

      <!-- Tabela Paginada -->
      <app-categoria-itens-tabela
        #tabela
        [dados]="respostaTabela().dados"
        [totalElementos]="respostaTabela().totalElementos"
        [tamanhoPagina]="respostaTabela().tamanhoPagina"
        [paginaAtual]="respostaTabela().paginaAtual"
        [carregando]="carregandoTabela()"
        [colunasVisiveis]="idsColunasVisiveis()"
        [ordenacao]="parametrosAtuais().sort ?? 'nome,asc'"
        (aoMudarPagina)="mudarPagina($event)"
        (aoMudarOrdem)="mudarOrdem($event)"
        (aoExportar)="exportar($event)"
      />
    </article>
  </div>
</section>
