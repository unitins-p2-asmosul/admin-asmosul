<form [formGroup]="form" (ngSubmit)="aplicar()" class="pagina-formulario !my-0 !w-full !max-w-none">
  <div class="grid gap-x-5 gap-y-2 sm:grid-cols-2">
    <div>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Pessoa (Nome ou CPF)</mat-label>
        <input
          matInput
          formControlName="termoBusca"
          (keydown.enter)="aplicar()"
          placeholder="Buscar por nome ou CPF"
        />
      </mat-form-field>
    </div>

    <div>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Comorbidades</mat-label>
        <mat-select
          formControlName="comorbidadeIds"
          multiple
          placeholder="Selecione as comorbidades"
        >
          @for (item of comorbidadesOpcoes(); track item.id) {
            <mat-option [value]="item.id">{{ item.nome }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="flex items-center justify-center !gap-4 !pt-4 !pb-2">
    <button mat-flat-button type="button" (click)="limpar()">
      Limpar
    </button>
    <button mat-flat-button type="submit" class="acao-primaria">
      Aplicar filtros
    </button>
  </div>
</form>
