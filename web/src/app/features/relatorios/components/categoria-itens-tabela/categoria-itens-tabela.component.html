<div class="pessoa-tabela-shell">
  <div class="pessoa-tabela-scroll">
    <table
      mat-table
      [dataSource]="dados()"
      matSort
      [matSortActive]="campoOrdenado"
      [matSortDirection]="direcaoOrdenada"
      matSortDisableClear
      (matSortChange)="aoMudarOrdem.emit($event)"
      class="pessoa-table"
    >
      <!-- Categoria -->
      <ng-container matColumnDef="nomeCategoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="nome">Categoria</th>
        <td mat-cell *matCellDef="let item" class="pessoa-table__texto font-semibold text-[#0b3c5d]">
          {{ item.nomeCategoria }}
        </td>
      </ng-container>

      <!-- Descrição -->
      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let item" class="pessoa-table__texto text-slate-600">
          {{ item.descricao || '-' }}
        </td>
      </ng-container>

      <!-- Itens Distintos -->
      <ng-container matColumnDef="itensDistintos">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="itensDistintos">Itens Distintos</th>
        <td mat-cell *matCellDef="let item" class="pessoa-table__texto font-bold text-[#1f2937]">
          {{ item.itensDistintos }}
        </td>
      </ng-container>

      <!-- Saldo Físico Total -->
      <ng-container matColumnDef="saldoFisico">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="saldoFisico">Saldo Físico Total</th>
        <td mat-cell *matCellDef="let item" class="pessoa-table__texto font-extrabold text-[#0b3c5d]">
          {{ item.saldoFisico }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasExibidas"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell p-6 text-center text-slate-500" [attr.colspan]="colunasExibidas.length">
          @if (carregando()) { Carregando categorias... } @else { Nenhuma categoria encontrada. }
        </td>
      </tr>
    </table>
  </div>

  <!-- Paginação -->
  <nav class="pessoa-tabela__paginacao" aria-label="Paginação da listagem de categorias">
    <button
      type="button"
      class="pessoa-tabela__pagina-seta"
      [disabled]="paginaAtual() === 0"
      aria-label="Página anterior"
      (click)="mudarPagina(paginaAtual() - 1)"
    >
      &lt;
    </button>

    @for (pagina of paginas; track pagina) {
      <button
        type="button"
        class="pessoa-tabela__pagina"
        [class.pessoa-tabela__pagina--ativa]="pagina === paginaAtual()"
        [attr.aria-current]="pagina === paginaAtual() ? 'page' : null"
        (click)="mudarPagina(pagina)"
      >
        {{ pagina + 1 }}
      </button>
    }

    <button
      type="button"
      class="pessoa-tabela__pagina-seta"
      [disabled]="paginaAtual() >= totalPaginas - 1"
      aria-label="Próxima página"
      (click)="mudarPagina(paginaAtual() + 1)"
    >
      &gt;
    </button>
  </nav>
</div>
