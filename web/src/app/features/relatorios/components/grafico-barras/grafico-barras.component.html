<section class="flex h-full w-full flex-col rounded-2xl border border-[#dfe4ea] bg-white p-6 shadow-xs">
  <header class="flex flex-wrap items-center justify-between gap-2 border-b border-[#f1f3f5] pb-4">
    <h2 class="m-0 text-base font-bold text-[#0b3c5d]">{{ titulo() }}</h2>

    <div class="flex items-center gap-2">
      @if (exibirSeletorAno()) {
        <select
          [ngModel]="anoSelecionado()"
          (ngModelChange)="selecionarAno($event)"
          class="h-8 rounded-lg border border-[#dfe4ea] bg-white px-2.5 text-xs font-semibold text-[#344054] outline-none focus:border-[#0b3c5d]"
          aria-label="Selecionar ano"
        >
          @for (ano of anosDisponiveis(); track ano) {
            <option [value]="ano">Ano: {{ ano }}</option>
          }
        </select>
      }

      <button
        type="button"
        (click)="exportarImagem()"
        [disabled]="dados().length === 0"
        class="inline-flex h-8 cursor-pointer items-center gap-1.5 rounded-lg border border-[#dfe4ea] bg-white px-3 text-xs font-semibold text-[#344054] shadow-2xs transition-colors hover:bg-[#f8fafc] disabled:cursor-not-allowed disabled:opacity-50"
        title="Exportar gráfico como imagem PNG"
      >
        <span class="material-icons text-base text-[#64748b]">image</span>
        <span>Imagem</span>
      </button>
    </div>
  </header>

  <div class="relative mt-6 h-[240px] w-full flex-1">
    <canvas #canvas class="h-full w-full"></canvas>
  </div>
</section>
