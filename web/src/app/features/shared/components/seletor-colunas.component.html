<button mat-stroked-button [matMenuTriggerFor]="menuColunas" type="button" class="flex items-center gap-2">
  <mat-icon>view_column</mat-icon>
  <span>Colunas</span>
</button>

<mat-menu #menuColunas="matMenu" class="p-2">
  <div class="flex flex-col gap-1" (click)="$event.stopPropagation()">
    @for (coluna of colunasDisponiveis(); track coluna.id) {
      <mat-checkbox
        [checked]="colunasVisiveis().includes(coluna.id)"
        (change)="alternarColuna(coluna.id)">
        {{ coluna.rotulo }}
      </mat-checkbox>
    }
  </div>
</mat-menu>
