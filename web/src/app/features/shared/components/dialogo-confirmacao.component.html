<h2 mat-dialog-title>{{ data.titulo }}</h2>
<mat-dialog-content>
  <p>{{ data.mensagem }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false" (click)="fechar()">Cancelar</button>
  <button matButton [mat-dialog-close]="true">Confirmar</button>
</mat-dialog-actions>
