<section class="pagina-pessoas">
  <header class="pagina-pessoas__header">
    <div class="pagina-pessoas__title-wrap">
      @if (icone()) {
        <span class="pagina-pessoas__title-icon" aria-hidden="true">
          <mat-icon>{{ icone() }}</mat-icon>
        </span>
      }
      <h1>{{ titulo() }}</h1>
    </div>

    @if (!adicionarNaToolbar()) {
      <button mat-flat-button type="button" class="pagina-pessoas__add" (click)="aoAdicionar.emit()">
        <mat-icon>{{ iconeAdicionar() }}</mat-icon>
        {{ rotuloAdicionar() }}
      </button>
    }
  </header>

  <div
    class="pagina-pessoas__toolbar"
    [class.pagina-pessoas__toolbar--distribuida]="adicionarNaToolbar()"
  >
    <div class="flex w-full min-w-0 items-center gap-2">
      <button
        mat-stroked-button
        type="button"
        class="pagina-pessoas__filter"
        [matTooltip]="filtrosAtivos() > 0 ? filtrosAtivos() + ' filtro(s) aplicado(s)' : 'Filtrar'"
        aria-label="Abrir filtros"
        (click)="aoFiltrar.emit()"
      >
        <mat-icon>filter_list</mat-icon>
        <span>Filtros</span>
        @if (filtrosAtivos() > 0) {
          <span>{{ filtrosAtivos() }}</span>
        }
      </button>
      <ng-content select="[toolbar-actions]" />
    </div>
    @if (adicionarNaToolbar()) {
      <button mat-flat-button type="button" class="pagina-pessoas__add" (click)="aoAdicionar.emit()">
        <mat-icon>{{ iconeAdicionar() }}</mat-icon>
        {{ rotuloAdicionar() }}
      </button>
    }
  </div>

  <ng-content />
</section>
